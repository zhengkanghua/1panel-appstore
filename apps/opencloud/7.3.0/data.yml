additionalProperties:
  formFields:
    - default: ""
      edit: true
      envKey: OC_URL
      labelEn: Public HTTPS URL (must exactly match the browser URL)
      labelZh: 外部 HTTPS 访问地址（必须与浏览器地址完全一致）
      label:
        en: 'Public HTTPS URL (must exactly match the browser URL)'
        zh: '外部 HTTPS 访问地址（必须与浏览器地址完全一致）'
      description:
        en: 'Must start with https:// and exactly match the browser address, including any non-standard port. For 1Panel reverse proxy, use the final public domain, for example https://cloud.example.com.'
        zh: '必须以 https:// 开头，并与浏览器最终访问地址完全一致（包括非标准端口）。使用 1Panel 反代时填写最终公网域名，例如 https://cloud.example.com。'
      required: true
      rule: paramExtUrl
      type: text
    - default: 9200
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Web Port
      labelZh: 网页端口
      label:
        en: 'Web Port'
        zh: '网页端口'
      description:
        en: 'Backend port used by the 1Panel reverse proxy. The recommended proxy target is http://127.0.0.1:this-port.'
        zh: '1Panel 反向代理使用的后端端口，推荐代理目标为 http://127.0.0.1:此端口。'
      required: true
      rule: paramPort
      type: number
    - default: "127.0.0.1"
      edit: true
      envKey: PANEL_APP_BIND_IP
      labelEn: Access method / host listen address
      labelZh: 访问方式 / 宿主机监听地址
      label:
        en: 'Access method / host listen address'
        zh: '访问方式 / 宿主机监听地址'
      description:
        en: 'Choose 127.0.0.1 for a reverse proxy on the same host. Choose 0.0.0.0 only for direct HTTPS access; built-in TLS must then be enabled.'
        zh: '同机 1Panel 反代请选择 127.0.0.1。仅直连 HTTPS 时选择 0.0.0.0，并且必须同时启用 OpenCloud 内置 TLS。'
      required: true
      type: select
      values:
        - label: "1Panel reverse proxy (127.0.0.1, recommended)"
          value: "127.0.0.1"
        - label: "Direct HTTPS access (0.0.0.0)"
          value: "0.0.0.0"
    - default: "false"
      edit: true
      envKey: PROXY_TLS
      labelEn: OpenCloud Built-in TLS
      labelZh: OpenCloud 内置 TLS
      label:
        en: 'OpenCloud Built-in TLS'
        zh: 'OpenCloud 内置 TLS'
      description:
        en: 'Select No when 1Panel terminates HTTPS. Select Yes only for direct access using OpenCloud self-signed HTTPS.'
        zh: '由 1Panel 网站终止 HTTPS 时选“否”；仅使用 OpenCloud 自签名 HTTPS 直连时选“是”。'
      required: true
      type: select
      values:
        - label: "No"
          value: "false"
        - label: "Yes"
          value: "true"
    - default: "false"
      edit: true
      envKey: INSECURE
      labelEn: Skip TLS Certificate Verification
      labelZh: 跳过 TLS 证书验证
      label:
        en: 'Skip TLS Certificate Verification'
        zh: '跳过 TLS 证书验证'
      description:
        en: 'Keep No for a trusted certificate managed by 1Panel. Select Yes only when OpenCloud or the upstream service uses a self-signed certificate.'
        zh: '1Panel 使用可信证书时保持“否”；仅 OpenCloud 或上游服务使用自签名证书时选择“是”。'
      required: true
      type: select
      values:
        - label: "No"
          value: "false"
        - label: "Yes"
          value: "true"
    - default: ""
      edit: false
      envKey: INITIAL_ADMIN_PASSWORD
      labelEn: Admin Password (only used on first start)
      labelZh: 管理员密码（仅首次启动生效）
      label:
        en: 'Admin Password (only used on first start)'
        zh: '管理员密码（仅首次启动生效）'
      description:
        en: 'Required before the first start. Changing this value later does not reset the existing admin password.'
        zh: '首次启动前必须设置。安装完成后修改此值不会重置已有管理员密码。'
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: "1000:1000"
      edit: false
      envKey: OC_CONTAINER_UID_GID
      labelEn: Container UID:GID (data directories use this owner)
      labelZh: 容器 UID:GID（数据目录将使用此属主）
      label:
        en: 'Container UID:GID (data directories use this owner)'
        zh: '容器 UID:GID（数据目录将使用此属主）'
      description:
        en: 'Official default is 1000:1000. Change only before installation when the storage filesystem requires another numeric owner.'
        zh: '官方默认值为 1000:1000。仅在存储文件系统要求其他数字属主时于安装前修改。'
      required: true
      type: text
    - default: ./data/config
      edit: false
      envKey: OC_CONFIG_DIR
      labelEn: Config folder path
      labelZh: 配置文件夹路径
      label:
        en: 'Config folder path'
        zh: '配置文件夹路径'
      description:
        en: 'Stores generated configuration and secrets. Back it up together with the data directory.'
        zh: '保存自动生成的配置和密钥，必须与数据目录一起备份。'
      required: true
      type: text
    - default: ./data/storage
      edit: false
      envKey: OC_DATA_DIR
      labelEn: Data folder path
      labelZh: 数据文件夹路径
      label:
        en: 'Data folder path'
        zh: '数据文件夹路径'
      description:
        en: 'Stores user files and can grow large. Use persistent storage with sufficient capacity.'
        zh: '保存用户文件且容量会持续增长，请选择空间充足的持久化存储。'
      required: true
      type: text
    - default: ./data/apps
      edit: false
      envKey: OC_APPS_DIR
      labelEn: Web extensions folder path
      labelZh: Web 扩展文件夹路径
      label:
        en: 'Web extensions folder path'
        zh: 'Web 扩展文件夹路径'
      description:
        en: 'Local OpenCloud Web extensions are loaded from this directory after a container restart.'
        zh: '本地 OpenCloud Web 扩展存放目录，放入扩展后需重启容器加载。'
      required: true
      type: text
    - default: decomposed
      edit: false
      envKey: STORAGE_USERS_DRIVER
      labelEn: Primary User Storage
      labelZh: 用户文件主存储
      label:
        en: 'Primary User Storage'
        zh: '用户文件主存储'
      description:
        en: 'Local storage uses the data directory. External S3 follows the official decomposeds3 configuration and must be selected before first start. This setting does not migrate existing data.'
        zh: '本地存储使用数据目录；外部 S3 严格采用官方 decomposeds3 配置，必须在首次启动前选择。修改此项不会迁移已有数据。'
      required: true
      type: select
      values:
        - label: "Local storage"
          value: "decomposed"
        - label: "External S3"
          value: "decomposeds3"
    - default: ""
      edit: false
      envKey: DECOMPOSEDS3_ENDPOINT
      labelEn: S3 Endpoint
      labelZh: S3 端点
      label:
        en: 'S3 Endpoint'
        zh: 'S3 端点'
      description:
        en: 'Required for External S3, for example https://s3.example.com. For a self-signed endpoint, also enable Skip TLS Certificate Verification.'
        zh: '选择外部 S3 时必填，例如 https://s3.example.com。S3 使用自签名证书时还需启用“跳过 TLS 证书验证”。'
      required: false
      type: text
    - default: default
      edit: false
      envKey: DECOMPOSEDS3_REGION
      labelEn: S3 Region
      labelZh: S3 区域
      label:
        en: 'S3 Region'
        zh: 'S3 区域'
      description:
        en: 'Region expected by the S3 provider. Keep default for providers that do not require a specific region.'
        zh: '填写 S3 服务商要求的区域；服务商不要求特定区域时保持 default。'
      required: true
      type: text
    - default: ""
      edit: false
      envKey: DECOMPOSEDS3_ACCESS_KEY
      labelEn: S3 Access Key
      labelZh: S3 Access Key
      label:
        en: 'S3 Access Key'
        zh: 'S3 Access Key'
      required: false
      type: text
    - default: ""
      edit: false
      envKey: DECOMPOSEDS3_SECRET_KEY
      labelEn: S3 Secret Key
      labelZh: S3 Secret Key
      label:
        en: 'S3 Secret Key'
        zh: 'S3 Secret Key'
      required: false
      type: password
    - default: ""
      edit: false
      envKey: DECOMPOSEDS3_BUCKET
      labelEn: S3 Bucket
      labelZh: S3 存储桶
      label:
        en: 'S3 Bucket'
        zh: 'S3 存储桶'
      description:
        en: 'Required for External S3. Create the bucket and grant the access key permission before installing OpenCloud.'
        zh: '选择外部 S3 时必填。安装 OpenCloud 前请先创建存储桶，并为 Access Key 授予访问权限。'
      required: false
      type: text
    - default: 5
      edit: false
      envKey: DECOMPOSEDS3_EVENTS_NUM_CONSUMERS
      labelEn: S3 Event Consumers
      labelZh: S3 事件消费者数量
      label:
        en: 'S3 Event Consumers'
        zh: 'S3 事件消费者数量'
      description:
        en: 'Official default is 5. Increase only for a tested high-throughput deployment.'
        zh: '官方默认值为 5，仅在经过验证的高吞吐部署中调整。'
      required: true
      type: number
    - default: Asia/Shanghai
      edit: true
      envKey: TIME_ZONE
      labelEn: Time Zone
      labelZh: 时区
      label:
        en: 'Time Zone'
        zh: '时区'
      required: true
      type: text
    - default: "en"
      edit: true
      envKey: DEFAULT_LANGUAGE
      labelEn: Default Language (ISO 639-1, for example en or zh)
      labelZh: 默认语言（ISO 639-1，例如 en 或 zh）
      label:
        en: 'Default Language (ISO 639-1, for example en or zh)'
        zh: '默认语言（ISO 639-1，例如 en 或 zh）'
      required: true
      type: text
    - default: "false"
      edit: true
      envKey: DEMO_USERS
      labelEn: Create demo users (public passwords; never enable in production)
      labelZh: 创建演示用户（密码公开，生产环境禁止启用）
      label:
        en: 'Create demo users (public passwords; never enable in production)'
        zh: '创建演示用户（密码公开，生产环境禁止启用）'
      description:
        en: 'Creates alan, mary, margaret, dennis and lynn with the public password demo. Never enable on a production instance.'
        zh: '会创建 alan、mary、margaret、dennis、lynn，密码均为公开的 demo。生产环境禁止启用。'
      required: true
      type: select
      values:
        - label: "No"
          value: "false"
        - label: "Yes"
          value: "true"
    - default: "false"
      edit: true
      envKey: PROXY_ENABLE_BASIC_AUTH
      labelEn: Enable Basic Auth (legacy WebDAV only; not recommended)
      labelZh: 启用 Basic Auth（仅旧式 WebDAV；不推荐）
      label:
        en: 'Enable Basic Auth (legacy WebDAV only; not recommended)'
        zh: '启用 Basic Auth（仅旧式 WebDAV；不推荐）'
      description:
        en: 'Officially not recommended for production. Enable only for WebDAV clients that cannot use OpenID Connect.'
        zh: '官方不建议在生产环境启用；仅供无法使用 OpenID Connect 的旧式 WebDAV 客户端。'
      required: true
      type: select
      values:
        - label: "No"
          value: "false"
        - label: "Yes"
          value: "true"
    - default: "true"
      edit: true
      envKey: CHECK_FOR_UPDATES
      labelEn: Check for OpenCloud Web updates
      labelZh: 检查 OpenCloud Web 更新
      label:
        en: 'Check for OpenCloud Web updates'
        zh: '检查 OpenCloud Web 更新'
      required: true
      type: select
      values:
        - label: "Yes"
          value: "true"
        - label: "No"
          value: "false"
    - default: "10000000000"
      edit: true
      envKey: FRONTEND_ARCHIVER_MAX_SIZE
      labelEn: Maximum archive download size in bytes
      labelZh: 归档下载最大字节数
      label:
        en: 'Maximum archive download size in bytes'
        zh: '归档下载最大字节数'
      required: true
      type: text
    - default: ""
      edit: true
      envKey: START_ADDITIONAL_SERVICES
      labelEn: Additional built-in services (use notifications to enable email)
      labelZh: 额外内置服务（填写 notifications 启用邮件通知）
      label:
        en: 'Additional built-in services (use notifications to enable email)'
        zh: '额外内置服务（填写 notifications 启用邮件通知）'
      description:
        en: 'The single-container 1Panel package supports the built-in notifications service. Antivirus and other official integrations require additional Compose services and are intentionally not listed here.'
        zh: '当前单容器 1Panel 应用可直接启用内置 notifications 邮件服务。杀毒等官方集成需要额外 Compose 服务，因此不会在此提供无效选项。'
      required: false
      type: select
      values:
        - label: "Disabled"
          value: ""
        - label: "Email notifications"
          value: "notifications"
    - default: info
      edit: true
      envKey: LOG_LEVEL
      labelEn: Log Level
      labelZh: 日志级别
      label:
        en: 'Log Level'
        zh: '日志级别'
      required: true
      type: select
      values:
        - label: "Info"
          value: "info"
        - label: "Warn"
          value: "warn"
        - label: "Error"
          value: "error"
        - label: "Debug"
          value: "debug"
        - label: "Trace"
          value: "trace"
    - default: "false"
      edit: true
      envKey: LOG_PRETTY
      labelEn: Human-readable colored logs
      labelZh: 人类可读彩色日志
      label:
        en: 'Human-readable colored logs'
        zh: '人类可读彩色日志'
      required: true
      type: select
      values:
        - label: "No"
          value: "false"
        - label: "Yes"
          value: "true"
    - default: local
      edit: true
      envKey: LOG_DRIVER
      labelEn: Docker log driver
      labelZh: Docker 日志驱动
      label:
        en: 'Docker log driver'
        zh: 'Docker 日志驱动'
      required: true
      type: select
      values:
        - label: "local"
          value: "local"
        - label: "json-file"
          value: "json-file"
    - default: ""
      edit: true
      envKey: SMTP_HOST
      labelEn: SMTP Host (requires notifications additional service)
      labelZh: SMTP 主机（需同时启用 notifications 服务）
      label:
        en: 'SMTP Host (requires notifications additional service)'
        zh: 'SMTP 主机（需同时启用 notifications 服务）'
      description:
        en: 'Only used when Additional built-in services is set to Email notifications.'
        zh: '仅当“额外内置服务”选择“邮件通知”时生效。'
      required: false
      type: text
    - default: 587
      edit: true
      envKey: SMTP_PORT
      labelEn: SMTP Port
      labelZh: SMTP 端口
      label:
        en: 'SMTP Port'
        zh: 'SMTP 端口'
      required: true
      rule: paramPort
      type: number
    - default: ""
      edit: true
      envKey: SMTP_SENDER
      labelEn: SMTP Sender (for example OpenCloud <no-reply@example.com>)
      labelZh: SMTP 发件人（例如 OpenCloud <no-reply@example.com>）
      label:
        en: 'SMTP Sender (for example OpenCloud <no-reply@example.com>)'
        zh: 'SMTP 发件人（例如 OpenCloud <no-reply@example.com>）'
      description:
        en: 'Use a sender accepted by the SMTP server, for example OpenCloud <no-reply@example.com>.'
        zh: '填写 SMTP 服务器允许的发件人，例如 OpenCloud <no-reply@example.com>。'
      required: false
      type: text
    - default: ""
      edit: true
      envKey: SMTP_USERNAME
      labelEn: SMTP Username
      labelZh: SMTP 用户名
      label:
        en: 'SMTP Username'
        zh: 'SMTP 用户名'
      required: false
      type: text
    - default: ""
      edit: true
      envKey: SMTP_PASSWORD
      labelEn: SMTP Password
      labelZh: SMTP 密码
      label:
        en: 'SMTP Password'
        zh: 'SMTP 密码'
      required: false
      type: password
    - default: auto
      edit: true
      envKey: SMTP_AUTHENTICATION
      labelEn: SMTP Authentication
      labelZh: SMTP 认证方式
      label:
        en: 'SMTP Authentication'
        zh: 'SMTP 认证方式'
      required: true
      type: select
      values:
        - label: "Auto"
          value: "auto"
        - label: "Login"
          value: "login"
        - label: "Plain"
          value: "plain"
        - label: "CRAM-MD5"
          value: "crammd5"
        - label: "None"
          value: "none"
    - default: none
      edit: true
      envKey: SMTP_TRANSPORT_ENCRYPTION
      labelEn: SMTP Transport Encryption
      labelZh: SMTP 传输加密
      label:
        en: 'SMTP Transport Encryption'
        zh: 'SMTP 传输加密'
      description:
        en: 'Use starttls for explicit TLS, ssltls for implicit TLS, or none only when required by the SMTP server.'
        zh: '显式 TLS 选 starttls，隐式 TLS 选 ssltls；仅 SMTP 服务器明确要求时选择 none。'
      required: true
      type: select
      values:
        - label: "None"
          value: "none"
        - label: "STARTTLS"
          value: "starttls"
        - label: "SSL/TLS"
          value: "ssltls"
    - default: "false"
      edit: true
      envKey: SMTP_INSECURE
      labelEn: Allow insecure SMTP connection
      labelZh: 允许不安全的 SMTP 连接
      label:
        en: 'Allow insecure SMTP connection'
        zh: '允许不安全的 SMTP 连接'
      description:
        en: 'Disables SMTP TLS certificate verification. Keep disabled unless the SMTP server uses a self-signed certificate.'
        zh: '关闭 SMTP TLS 证书验证。除非 SMTP 服务器使用自签名证书，否则保持禁用。'
      required: true
      type: select
      values:
        - label: "No"
          value: "false"
        - label: "Yes"
          value: "true"
    - default: "true"
      edit: true
      envKey: OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD
      labelEn: Require passwords for public shares
      labelZh: 公共分享必须设置密码
      label:
        en: 'Require passwords for public shares'
        zh: '公共分享必须设置密码'
      required: true
      type: select
      values:
        - label: "Yes"
          value: "true"
        - label: "No"
          value: "false"
    - default: "false"
      edit: true
      envKey: OC_SHARING_PUBLIC_WRITEABLE_SHARE_MUST_HAVE_PASSWORD
      labelEn: Require passwords for writable public shares
      labelZh: 可写公共分享必须设置密码
      label:
        en: 'Require passwords for writable public shares'
        zh: '可写公共分享必须设置密码'
      required: true
      type: select
      values:
        - label: "No"
          value: "false"
        - label: "Yes"
          value: "true"
    - default: "false"
      edit: true
      envKey: OC_PASSWORD_POLICY_DISABLED
      labelEn: Disable password policy (not recommended)
      labelZh: 禁用密码策略（不推荐）
      label:
        en: 'Disable password policy (not recommended)'
        zh: '禁用密码策略（不推荐）'
      description:
        en: 'Keep No so the official banned-password list and complexity requirements remain active.'
        zh: '保持“否”，以继续启用官方禁用密码列表和密码复杂度要求。'
      required: true
      type: select
      values:
        - label: "No"
          value: "false"
        - label: "Yes"
          value: "true"
    - default: 8
      edit: true
      envKey: OC_PASSWORD_POLICY_MIN_CHARACTERS
      labelEn: Minimum password length
      labelZh: 密码最小长度
      label:
        en: 'Minimum password length'
        zh: '密码最小长度'
      required: true
      type: number
    - default: 1
      edit: true
      envKey: OC_PASSWORD_POLICY_MIN_LOWERCASE_CHARACTERS
      labelEn: Minimum lowercase characters
      labelZh: 最少小写字母数
      label:
        en: 'Minimum lowercase characters'
        zh: '最少小写字母数'
      required: true
      type: number
    - default: 1
      edit: true
      envKey: OC_PASSWORD_POLICY_MIN_UPPERCASE_CHARACTERS
      labelEn: Minimum uppercase characters
      labelZh: 最少大写字母数
      label:
        en: 'Minimum uppercase characters'
        zh: '最少大写字母数'
      required: true
      type: number
    - default: 1
      edit: true
      envKey: OC_PASSWORD_POLICY_MIN_DIGITS
      labelEn: Minimum digits
      labelZh: 最少数字数
      label:
        en: 'Minimum digits'
        zh: '最少数字数'
      required: true
      type: number
    - default: 1
      edit: true
      envKey: OC_PASSWORD_POLICY_MIN_SPECIAL_CHARACTERS
      labelEn: Minimum special characters
      labelZh: 最少特殊字符数
      label:
        en: 'Minimum special characters'
        zh: '最少特殊字符数'
      required: true
      type: number
