services:
  opencloud-permissions:
    image: opencloudeu/opencloud-rolling:7.3.0
    container_name: ${CONTAINER_NAME}-permissions
    user: "0:0"
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - "mkdir -p /mnt/config /mnt/storage /mnt/apps && chown \"${OC_CONTAINER_UID_GID:-1000:1000}\" /mnt/config /mnt/storage /mnt/apps || true"
    volumes:
      - ${OC_CONFIG_DIR:-./data/config}:/mnt/config
      - ${OC_DATA_DIR:-./data/storage}:/mnt/storage
      - ${OC_APPS_DIR:-./data/apps}:/mnt/apps
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

  opencloud:
    # Keep latest reproducible and aligned with the current official Compose release.
    image: opencloudeu/opencloud-rolling:7.3.0
    container_name: ${CONTAINER_NAME}
    user: "${OC_CONTAINER_UID_GID:-1000:1000}"
    restart: always
    depends_on:
      opencloud-permissions:
        condition: service_completed_successfully
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_BIND_IP:-127.0.0.1}:${PANEL_APP_PORT_HTTP}:9200"
    entrypoint:
      - /bin/sh
    # run opencloud init to initialize a configuration file with random secrets
    # it will fail on subsequent runs, because the config file already exists
    # therefore we ignore the error and then start the opencloud server
    command:
      - /opt/opencloud/start.sh
    environment:
      # external access URL, must be https and match the browser address
      OC_URL: ${OC_URL:-https://localhost:9200}
      # listen on all interfaces so the published port is reachable
      PROXY_HTTP_ADDR: "0.0.0.0:9200"
      # also pass the host binding into the startup script guard
      PANEL_APP_BIND_IP: "${PANEL_APP_BIND_IP:-127.0.0.1}"
      # true  = serve self-signed https directly on the published port
      # false = plain http, use it behind a TLS-terminating reverse proxy
      PROXY_TLS: "${PROXY_TLS:-false}"
      # needed if OpenCloud / reverse proxy is using self-signed certificates
      OC_INSECURE: "${INSECURE:-false}"
      # enable services that are not started automatically
      OC_ADD_RUN_SERVICES: "${START_ADDITIONAL_SERVICES:-}"
      OC_LOG_LEVEL: "${LOG_LEVEL:-info}"
      OC_LOG_COLOR: "${LOG_PRETTY:-false}"
      OC_LOG_PRETTY: "${LOG_PRETTY:-false}"
      # basic auth (not recommended, but needed for eg. WebDAV clients that do not support OpenID Connect)
      PROXY_ENABLE_BASIC_AUTH: "${PROXY_ENABLE_BASIC_AUTH:-false}"
      IDM_CREATE_DEMO_USERS: "${DEMO_USERS:-false}"
      # admin password, only effective on the very first start
      IDM_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD}"
      # optional decomposed S3 primary storage (official storage/decomposeds3.yml)
      STORAGE_USERS_DRIVER: "${STORAGE_USERS_DRIVER:-decomposed}"
      STORAGE_SYSTEM_DRIVER: "decomposed"
      STORAGE_USERS_DECOMPOSEDS3_ENDPOINT: "${DECOMPOSEDS3_ENDPOINT:-}"
      STORAGE_USERS_DECOMPOSEDS3_REGION: "${DECOMPOSEDS3_REGION:-default}"
      STORAGE_USERS_DECOMPOSEDS3_ACCESS_KEY: "${DECOMPOSEDS3_ACCESS_KEY:-}"
      STORAGE_USERS_DECOMPOSEDS3_SECRET_KEY: "${DECOMPOSEDS3_SECRET_KEY:-}"
      STORAGE_USERS_DECOMPOSEDS3_BUCKET: "${DECOMPOSEDS3_BUCKET:-}"
      STORAGE_USERS_EVENTS_NUM_CONSUMERS: "${DECOMPOSEDS3_EVENTS_NUM_CONSUMERS:-5}"
      # email server (used when notifications is added to START_ADDITIONAL_SERVICES)
      NOTIFICATIONS_SMTP_HOST: "${SMTP_HOST:-}"
      NOTIFICATIONS_SMTP_PORT: "${SMTP_PORT:-}"
      NOTIFICATIONS_SMTP_SENDER: "${SMTP_SENDER:-OpenCloud Notifications <notifications@cloud.opencloud.test>}"
      NOTIFICATIONS_SMTP_USERNAME: "${SMTP_USERNAME:-}"
      NOTIFICATIONS_SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      NOTIFICATIONS_SMTP_INSECURE: "${SMTP_INSECURE:-false}"
      NOTIFICATIONS_SMTP_AUTHENTICATION: "${SMTP_AUTHENTICATION:-auto}"
      NOTIFICATIONS_SMTP_ENCRYPTION: "${SMTP_TRANSPORT_ENCRYPTION:-none}"
      FRONTEND_ARCHIVER_MAX_SIZE: "${FRONTEND_ARCHIVER_MAX_SIZE:-10000000000}"
      FRONTEND_CHECK_FOR_UPDATES: "${CHECK_FOR_UPDATES:-true}"
      PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/csp.yaml
      # enable to allow using the banned passwords list
      OC_PASSWORD_POLICY_BANNED_PASSWORDS_LIST: banned-password-list.txt
      # control the password enforcement and policy for public shares
      OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD: "${OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD:-true}"
      OC_SHARING_PUBLIC_WRITEABLE_SHARE_MUST_HAVE_PASSWORD: "${OC_SHARING_PUBLIC_WRITEABLE_SHARE_MUST_HAVE_PASSWORD:-false}"
      OC_PASSWORD_POLICY_DISABLED: "${OC_PASSWORD_POLICY_DISABLED:-false}"
      OC_PASSWORD_POLICY_MIN_CHARACTERS: "${OC_PASSWORD_POLICY_MIN_CHARACTERS:-8}"
      OC_PASSWORD_POLICY_MIN_LOWERCASE_CHARACTERS: "${OC_PASSWORD_POLICY_MIN_LOWERCASE_CHARACTERS:-1}"
      OC_PASSWORD_POLICY_MIN_UPPERCASE_CHARACTERS: "${OC_PASSWORD_POLICY_MIN_UPPERCASE_CHARACTERS:-1}"
      OC_PASSWORD_POLICY_MIN_DIGITS: "${OC_PASSWORD_POLICY_MIN_DIGITS:-1}"
      OC_PASSWORD_POLICY_MIN_SPECIAL_CHARACTERS: "${OC_PASSWORD_POLICY_MIN_SPECIAL_CHARACTERS:-1}"
      # default language for services/WebUI (ISO 639-1, e.g. de, en, fr)
      OC_DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      TZ: ${TIME_ZONE:-Asia/Shanghai}
    volumes:
      - ./scripts/start.sh:/opt/opencloud/start.sh:ro
      - ./init/csp.yaml:/etc/opencloud/csp.yaml:ro
      - ./init/banned-password-list.txt:/etc/opencloud/banned-password-list.txt:ro
      - ${OC_CONFIG_DIR:-./data/config}:/etc/opencloud
      - ${OC_DATA_DIR:-./data/storage}:/var/lib/opencloud
      # OpenCloud Web can load extensions from this directory
      - ${OC_APPS_DIR:-./data/apps}:/var/lib/opencloud/web/assets/apps
    logging:
      driver: ${LOG_DRIVER:-local}
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
