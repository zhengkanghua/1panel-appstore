additionalProperties:
  formFields:
    - default: 8080
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Port
      labelZh: HTTP端口
      label:
        en: 'HTTP Port'
        zh: 'HTTP端口'
        zh-Hant: 'HTTP 埠'
        ja: 'HTTP ポート'
        ko: 'HTTP 포트'
        ru: 'HTTP-порт'
        ms: 'Port HTTP'
        pt-br: 'Porta HTTP'
      required: true
      rule: paramPort
      type: number
    - default: ""
      edit: true
      envKey: OC_DOMAIN
      labelEn: Domain (e.g. cloud.example.com)
      labelZh: 域名 (如 cloud.example.com)
      label:
        en: 'Domain (e.g. cloud.example.com)'
        zh: '域名 (如 cloud.example.com)'
        zh-Hant: '網域 (如 cloud.example.com)'
        ja: 'ドメイン (例: cloud.example.com)'
        ko: '도메인 (예: cloud.example.com)'
        ru: 'Домен (например cloud.example.com)'
        ms: 'Domain (contoh: cloud.example.com)'
        pt-br: 'Domínio (ex: cloud.example.com)'
      required: false
      type: text
    - default: "admin"
      edit: true
      envKey: INITIAL_ADMIN_PASSWORD
      labelEn: Admin Password
      labelZh: 管理员密码
      label:
        en: 'Admin Password'
        zh: '管理员密码'
        zh-Hant: '管理員密碼'
        ja: '管理者パスワード'
        ko: '관리자 비밀번호'
        ru: 'Пароль администратора'
        ms: 'Kata laluan pentadbir'
        pt-br: 'Senha do administrador'
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: ./data/config
      edit: true
      envKey: OC_CONFIG_PATH
      labelEn: Config folder path
      labelZh: 配置文件夹路径
      label:
        en: 'Config folder path'
        zh: '配置文件夹路径'
        zh-Hant: '設定資料夾路徑'
        ja: '設定フォルダパス'
        ko: '구성 폴더 경로'
        ru: 'Путь к папке конфигурации'
        ms: 'Laluan folder konfigurasi'
        pt-br: 'Caminho da pasta de configuração'
      required: true
      type: text
    - default: ./data/storage
      edit: true
      envKey: OC_DATA_PATH
      labelEn: Data folder path
      labelZh: 数据文件夹路径
      label:
        en: 'Data folder path'
        zh: '数据文件夹路径'
        zh-Hant: '資料夾路徑'
        ja: 'データフォルダパス'
        ko: '데이터 폴더 경로'
        ru: 'Путь к папке данных'
        ms: 'Laluan folder data'
        pt-br: 'Caminho da pasta de dados'
      required: true
      type: text
    - default: Asia/Shanghai
      edit: true
      envKey: TIME_ZONE
      labelEn: Time Zone
      labelZh: 时区
      label:
        en: 'Time Zone'
        zh: '时区'
        zh-Hant: '時區'
        ja: 'タイムゾーン'
        ko: '시간대'
        ru: 'Часовой пояс'
        ms: 'Zon masa'
        pt-br: 'Fuso horário'
      required: true
      type: text
    - default: "true"
      edit: true
      envKey: INSECURE
      labelEn: Skip certificate validation (for self-signed certs)
      labelZh: 跳过证书验证 (用于自签名证书)
      label:
        en: 'Skip certificate validation (for self-signed certs)'
        zh: '跳过证书验证 (用于自签名证书)'
        zh-Hant: '跳過證書驗證 (用於自簽名證書)'
        ja: '証明書検証をスキップ (自己署名証明書用)'
        ko: '인증서 검증 건너뛰기 (자체 서명 인증서용)'
        ru: 'Пропустить проверку сертификата (для самоподписанных)'
        ms: 'Langkahkan pengesahan sijil (untuk sijil sendiri)'
        pt-br: 'Pular validação de certificado (para certificados autoassinados)'
      required: true
      type: select
      values:
        - label: "Yes"
          value: "true"
        - label: "No"
          value: "false"
