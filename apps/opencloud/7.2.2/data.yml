additionalProperties:
  formFields:
    - default: 9200
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Web Port
      labelZh: 网页端口
      label:
        en: 'Web Port'
        zh: '网页端口'
        zh-Hant: '網頁埠'
        ja: 'ウェブポート'
        ko: '웹 포트'
        ru: 'Веб-порт'
        ms: 'Port web'
        pt-br: 'Porta web'
      required: true
      rule: paramPort
      type: number
    - default: "https://localhost:9200"
      edit: true
      envKey: OC_URL
      labelEn: Access URL (must be https and match browser address)
      labelZh: 访问地址 (必须为 https 且与浏览器地址一致)
      label:
        en: 'Access URL (must be https and match browser address)'
        zh: '访问地址 (必须为 https 且与浏览器地址一致)'
        zh-Hant: '存取網址 (必須為 https 且與瀏覽器網址一致)'
        ja: 'アクセスURL (httpsでブラウザのアドレスと一致させる)'
        ko: '접속 URL (https여야 하며 브라우저 주소와 일치해야 함)'
        ru: 'Адрес доступа (https, должен совпадать с адресом в браузере)'
        ms: 'URL akses (mesti https dan sepadan dengan alamat pelayar)'
        pt-br: 'URL de acesso (deve ser https e igual ao endereço do navegador)'
      required: true
      type: text
    - default: ""
      edit: true
      envKey: INITIAL_ADMIN_PASSWORD
      labelEn: Admin Password (set on first start only)
      labelZh: 管理员密码 (仅首次启动生效)
      label:
        en: 'Admin Password (set on first start only)'
        zh: '管理员密码 (仅首次启动生效)'
        zh-Hant: '管理員密碼 (僅首次啟動生效)'
        ja: '管理者パスワード (初回起動時のみ有効)'
        ko: '관리자 비밀번호 (최초 시작 시에만 적용)'
        ru: 'Пароль администратора (задаётся только при первом запуске)'
        ms: 'Kata laluan pentadbir (hanya pada permulaan pertama)'
        pt-br: 'Senha do administrador (definida apenas na primeira inicialização)'
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: "true"
      edit: true
      envKey: PROXY_TLS
      labelEn: Built-in self-signed HTTPS (Yes for direct access, No behind reverse proxy)
      labelZh: 内置自签名 HTTPS (直连访问选是, 反向代理后选否)
      label:
        en: 'Built-in self-signed HTTPS (Yes for direct access, No behind reverse proxy)'
        zh: '内置自签名 HTTPS (直连访问选是, 反向代理后选否)'
        zh-Hant: '內建自簽名 HTTPS (直連存取選是, 反向代理後選否)'
        ja: '内蔵自己署名HTTPS (直接アクセスは「はい」、リバースプロキシ配下は「いいえ」)'
        ko: '내장 자체 서명 HTTPS (직접 접속 시 예, 리버스 프록시 뒤에서는 아니오)'
        ru: 'Встроенный самоподписанный HTTPS (Да — прямой доступ, Нет — за обратным прокси)'
        ms: 'HTTPS tandatangan sendiri terbina dalam (Ya untuk akses terus, Tidak di belakang proksi songsang)'
        pt-br: 'HTTPS autoassinado embutido (Sim para acesso direto, Não atrás de proxy reverso)'
      required: true
      type: select
      values:
        - label: "Yes"
          value: "true"
        - label: "No"
          value: "false"
    - default: "true"
      edit: true
      envKey: INSECURE
      labelEn: Skip certificate validation (for self-signed certs)
      labelZh: 跳过证书验证 (用于自签名证书)
      label:
        en: 'Skip certificate validation (for self-signed certs)'
        zh: '跳过证书验证 (用于自签名证书)'
        zh-Hant: '跳過證書驗證 (用於自簽名證書)'
        ja: '証明書検証をスキップ (自己署名証明書用)'
        ko: '인증서 검증 건너뛰기 (자체 서명 인증서용)'
        ru: 'Пропустить проверку сертификата (для самоподписанных)'
        ms: 'Langkahkan pengesahan sijil (untuk sijil sendiri)'
        pt-br: 'Pular validação de certificado (para certificados autoassinados)'
      required: true
      type: select
      values:
        - label: "Yes"
          value: "true"
        - label: "No"
          value: "false"
    - default: ./data/config
      edit: true
      envKey: OC_CONFIG_DIR
      labelEn: Config folder path
      labelZh: 配置文件夹路径
      label:
        en: 'Config folder path'
        zh: '配置文件夹路径'
        zh-Hant: '設定資料夾路徑'
        ja: '設定フォルダパス'
        ko: '구성 폴더 경로'
        ru: 'Путь к папке конфигурации'
        ms: 'Laluan folder konfigurasi'
        pt-br: 'Caminho da pasta de configuração'
      required: true
      type: text
    - default: ./data/storage
      edit: true
      envKey: OC_DATA_DIR
      labelEn: Data folder path
      labelZh: 数据文件夹路径
      label:
        en: 'Data folder path'
        zh: '数据文件夹路径'
        zh-Hant: '資料夾路徑'
        ja: 'データフォルダパス'
        ko: '데이터 폴더 경로'
        ru: 'Путь к папке данных'
        ms: 'Laluan folder data'
        pt-br: 'Caminho da pasta de dados'
      required: true
      type: text
    - default: Asia/Shanghai
      edit: true
      envKey: TIME_ZONE
      labelEn: Time Zone
      labelZh: 时区
      label:
        en: 'Time Zone'
        zh: '时区'
        zh-Hant: '時區'
        ja: 'タイムゾーン'
        ko: '시간대'
        ru: 'Часовой пояс'
        ms: 'Zon masa'
        pt-br: 'Fuso horário'
      required: true
      type: text
    - default: "en"
      edit: true
      envKey: DEFAULT_LANGUAGE
      labelEn: Default Language (ISO 639-1, e.g. en, de, zh)
      labelZh: 默认语言 (ISO 639-1, 如 en, de, zh)
      label:
        en: 'Default Language (ISO 639-1, e.g. en, de, zh)'
        zh: '默认语言 (ISO 639-1, 如 en, de, zh)'
        zh-Hant: '預設語言 (ISO 639-1, 如 en, de, zh)'
        ja: 'デフォルト言語 (ISO 639-1, 例: en, de, zh)'
        ko: '기본 언어 (ISO 639-1, 예: en, de, zh)'
        ru: 'Язык по умолчанию (ISO 639-1, например en, de, zh)'
        ms: 'Bahasa lalai (ISO 639-1, contoh: en, de, zh)'
        pt-br: 'Idioma padrão (ISO 639-1, ex: en, de, zh)'
      required: false
      type: text
    - default: "false"
      edit: true
      envKey: PROXY_ENABLE_BASIC_AUTH
      labelEn: Enable Basic Auth (for WebDAV clients)
      labelZh: 启用 Basic Auth (供 WebDAV 客户端使用)
      label:
        en: 'Enable Basic Auth (for WebDAV clients)'
        zh: '启用 Basic Auth (供 WebDAV 客户端使用)'
        zh-Hant: '啟用 Basic Auth (供 WebDAV 客戶端使用)'
        ja: 'Basic認証を有効化 (WebDAVクライアント用)'
        ko: 'Basic Auth 활성화 (WebDAV 클라이언트용)'
        ru: 'Включить Basic Auth (для WebDAV клиентов)'
        ms: 'Dayakan Basic Auth (untuk klien WebDAV)'
        pt-br: 'Habilitar Basic Auth (para clientes WebDAV)'
      required: false
      type: select
      values:
        - label: "Yes"
          value: "true"
        - label: "No"
          value: "false"
